spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coursehub}
    username: ${DB_USERNAME:coursehub}
    password: ${DB_PASSWORD:coursehub}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

coursehub:
  demo:
    enabled: true
